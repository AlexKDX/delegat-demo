<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Восток AI · Та же команда. Меньше ручной работы.</title>
<meta name="description" content="Восток AI находит рутинные процессы в вашем бизнесе и передаёт их ИИ-агентам. Бесплатный разбор процессов. Владивосток и Дальний Восток.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Manrope:wght@800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="engine.css?v=4">
<style>
/* Главный экран «Восток AI». Тема «Claude · ночь». */
:root{--ink:#141413;--fg:#F0EFEA;--muted:#a3a29c;--acc:#D97757;--acc-ink:#141413;--hot:#6A9BCC;--card:#1c1c1a;--card-2:#232320;--card-line:#ffffff12;--card-fg:#F0EFEA;--card-muted:#91918D;--scrim:20,20,19}
</style></head>
<body>
<section class="stage" id="stage"></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
window.STORY = {
  nav: [['Как работаем', '#after'], ['Услуги', '#after'], ['Кейсы', '#after'], ['О нас', '#after']],
  cta: 'Бесплатный разбор процессов',
  top: {mode: 'clock'},
  num: {peak: 84, after: 30},
  unit: ['часов в месяц уходит на ручную работу', 'часов в месяц, когда рутину ведут агенты'],
  caps: [
    {k: 'Восток AI · Владивосток', h: 'Та же команда. <em>Меньше ручной работы.</em>',
     p: 'Находим рутинные процессы в вашем бизнесе и передаём их ИИ-агентам.'},
    {k: 'Как сейчас', h: 'Заявки, отчёты, сверки, переписка — <span class="hot">всё вручную.</span>'},
    {k: 'С ИИ-агентами', h: 'Команда занимается <em>важными задачами.</em>',
     p: 'А мы повышаем эффективность бизнеса и каждого сотрудника.'},
  ],
  result: [{t: 'Та же команда.'}, {t: 'Меньше ручной работы.', c: 'money'}],
  steps: [
    ['Разбор', 'смотрим процессы вместе с вами, бесплатно'],
    ['Внедрение', 'агенты начинают работать через 2 недели'],
    ['Результат', 'показываем, сколько часов ручной работы ушло'],
  ],
  note: 'Цифры на экране — пример для одного сотрудника: до 4 часов в день на рутину (НАФИ и «Яндекс 360», 2025), ИИ может взять до 60–70% такой работы (McKinsey, 2023). Цифры вашего бизнеса покажем на разборе.',
};
window.THEME_BG = el => {
  el.style.background = 'repeating-linear-gradient(135deg,#ffffff05 0 1px,transparent 1px 14px),#141413';
  ['#D97757', '#CC785C', '#6A9BCC'].forEach((col, i) => { const g = document.createElement('div'); g.style.cssText = `position:absolute;width:60vmax;height:60vmax;border-radius:50%;left:${[10, 60, 30][i]}%;top:${[60, 10, 80][i]}%;margin:-30vmax 0 0 -30vmax;background:radial-gradient(circle,${col}${i == 2 ? '22' : '38'},transparent 62%);filter:blur(20px)`; el.append(g); gsap.to(g, {scale: 1.25, opacity: .6, x: (i - 1) * 120, duration: 8 + i * 3, yoyo: true, repeat: -1, ease: 'sine.inOut'}); });
  return {};
};
</script>
<script src="engine.js?v=4"></script>
</body></html>
